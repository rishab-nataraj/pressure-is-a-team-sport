[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superr-selector"
version = "1.0.0"
description = "SupeRR Selector S2: rank T20 batters and bowlers under pressure with a joint player-clutch (P) / team-clutch (T) model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "requests>=2.31",
  "networkx>=3.0",
  "pyarrow>=14",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
superr = "superr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
